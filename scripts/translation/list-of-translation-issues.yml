# Registry of the GitHub issues that track translation of the Python Package Guide.
#
# Each language has one parent issue plus one sub-issue per active .po file.
# This file is the register for those issue numbers.
#
# It is written by scripts/translation/update_translation_issues.py, which rebuilds
# it in full on every run, so keep any edit here to the values themselves. Files
# are listed alphabetically, the same way for every language, so they are easy to
# compare. `example` is the file shown in the parent's "See an example" section.

repo: pyOpenSci/python-package-guide
updated: "2026-07-20"

# Labels applied when an issue is created, on top of the language's own `label`.
# Changing these does not relabel issues that already exist.
labels:
  parent:
    - help wanted
    - sprintable
    - translations
    - beginner-friendly
  subissue:
    - good first issue
    - translations
    - beginner-friendly

languages:
